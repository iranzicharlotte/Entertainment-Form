<!DOCTYPE html>
<html>
<head>
  <title>Entertainment Form</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f4f4f4;
      transition:0.3s;
    }

    /* DARK MODE */
    body.dark{
      background:#111827;
      color:white;
    }

    /* HEADER */
    header{
      background:#1e3a8a;
      color:white;
      padding:15px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    /* DARK MODE BUTTON */
    .toggle-btn{
      background:white;
      color:#1e3a8a;
      border:none;
      padding:8px 12px;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }

    /* CENTER FORM */
    .container{
      width:40%;
      margin:40px auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      transition:0.3s;
    }

    body.dark .container{
      background:#1f2937;
      color:white;
    }

    input, select, textarea{
      width:100%;
      padding:8px;
      margin-top:5px;
      margin-bottom:15px;
      border-radius:5px;
      border:1px solid #ccc;
    }

    button.submit{
      background:#2563eb;
      color:white;
      border:none;
      padding:10px;
      width:100%;
      border-radius:5px;
      cursor:pointer;
    }

    button.submit:hover{
      background:#1e40af;
    }

    /* FOOTER */
    footer{
      background:#1e3a8a;
      color:white;
      text-align:center;
      padding:15px;
      margin-top:30px;
    }

    /* RESPONSIVE */
    @media(max-width:768px){
      .container{
        width:85%;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>Entertainment System</h2>
  <button class="toggle-btn" onclick="toggleDark()">🌙 Dark Mode</button>
</header>

<div class="container">

  <h2>Entertainment Form</h2>

  <form>
    <label>Full Name:</label>
    <input type="text" name="fullname">

    <label>Favorite Entertainment Type:</label>
    <select name="entertainment">
      <option>Music</option>
      <option>Movies</option>
      <option>Games</option>
      <option>Sports</option>
      <option>Comedy</option>
    </select>

    <label>How often do you enjoy entertainment?</label><br>
    <input type="radio" name="frequency"> Daily
    <input type="radio" name="frequency"> Weekly
    <input type="radio" name="frequency"> Monthly<br><br>

    <label>Comments:</label>
    <textarea rows="4"></textarea>

    <button class="submit" type="submit">Submit</button>
  </form>

</div>

<footer>
  <p>&copy; 2026 Entertainment System</p>
</footer>

<script>
  function toggleDark(){
    document.body.classList.toggle("dark");
  }
</script>

</body>
</html>
